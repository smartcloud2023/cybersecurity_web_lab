services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cyberlab
      POSTGRES_PASSWORD: cyberlab
      POSTGRES_DB: cyberlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberlab -d cyberlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://cyberlab:cyberlab@db:5432/cyberlab
      ENVIRONMENT: production
      # Set a real SECRET_KEY in .env before deploying — see .env.example.
      # Anyone with this value can forge a login token for any account.
      SECRET_KEY: ${SECRET_KEY:-please-set-a-real-secret-key-in-env}
      # No CORS_ORIGINS override — web and api share an origin behind
      # nginx, so cross-origin CORS never triggers here.
      # Optional — unset means verification codes only land in this
      # container's logs (`docker compose logs api`), not a real inbox. Set
      # these in .env before relying on email verification with real users
      # — see apps/api/.env.example for setup (Gmail App Password or SES).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@cyberlab.local}
      # LAB_PROVISIONER=fake (the default) tracks lab sessions through the
      # full state machine without starting any containers — safe with no
      # further setup. Switch to "docker" only once you've built the lab
      # image(s) (e.g. `docker build -t cyberlab/web001:latest ./labs/WEB001`)
      # — the docker.sock mount below is what lets this container start
      # sibling lab containers on the host; treat that mount as seriously as
      # SECRET_KEY, since it's effectively root-equivalent host access.
      LAB_PROVISIONER: ${LAB_PROVISIONER:-fake}
      LAB_DOCKER_NETWORK: ${LAB_DOCKER_NETWORK:-cyberlab_lab_net}
      LAB_PUBLIC_HOST: ${LAB_PUBLIC_HOST:-localhost}
      LAB_IDLE_TIMEOUT_MINUTES: ${LAB_IDLE_TIMEOUT_MINUTES:-10}
      LAB_MAX_DURATION_MINUTES: ${LAB_MAX_DURATION_MINUTES:-120}
      LAB_DAILY_SESSION_LIMIT: ${LAB_DAILY_SESSION_LIMIT:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      lab-net-setup:
        condition: service_completed_successfully

  # Creates the lab containers' Docker network if it doesn't already exist —
  # a plain `docker network create`, not a compose-managed network, since
  # lab containers are started directly by the api container (via the
  # socket mount above) rather than through compose.
  lab-net-setup:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: sh
    command:
      - -c
      - docker network inspect ${LAB_DOCKER_NETWORK:-cyberlab_lab_net} >/dev/null 2>&1 || docker network create ${LAB_DOCKER_NETWORK:-cyberlab_lab_net}

  web:
    build: ./apps/web
    expose:
      - "3000"
    depends_on:
      - api

  # One-shot: guarantees a certificate file exists before nginx's first start
  # (nginx refuses to start if ssl_certificate points at a missing file). If
  # Let's Encrypt hasn't issued a real one yet, this drops in a self-signed
  # placeholder at the same path — init-letsencrypt.sh replaces it with a
  # real certificate later without touching this container.
  certbot-init:
    image: alpine:3.20
    volumes:
      - certbot-conf:/etc/letsencrypt
    entrypoint: sh
    command:
      - -c
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        DOMAIN_DIR="/etc/letsencrypt/live/${DOMAIN:-sec.digitalwitch.online}"
        if [ ! -f "$$DOMAIN_DIR/fullchain.pem" ]; then
          mkdir -p "$$DOMAIN_DIR"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$$DOMAIN_DIR/privkey.pem" \
            -out "$$DOMAIN_DIR/fullchain.pem" \
            -subj "/CN=${DOMAIN:-sec.digitalwitch.online}"
          echo "Generated temporary self-signed cert for ${DOMAIN:-sec.digitalwitch.online}"
        else
          echo "Certificate already present at $$DOMAIN_DIR, skipping"
        fi

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN:-sec.digitalwitch.online}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      certbot-init:
        condition: service_completed_successfully
      web:
        condition: service_started
      api:
        condition: service_started
    # The base image's default.conf would otherwise sit alongside our
    # templated app.conf and catch requests with an unexpected Host header.
    command: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]

  # Renews the certificate on a loop once it's real (a no-op against the
  # self-signed placeholder). Run init-letsencrypt.sh once on the actual
  # deployment host to obtain the first real certificate.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot
          sleep 12h & wait $${!}
        done

volumes:
  pgdata:
  certbot-conf:
  certbot-www:
