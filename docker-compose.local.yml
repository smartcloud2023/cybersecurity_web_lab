services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cyberlab
      POSTGRES_PASSWORD: cyberlab
      POSTGRES_DB: cyberlab
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberlab -d cyberlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://cyberlab:cyberlab@db:5432/cyberlab
      ENVIRONMENT: development
      # Local-dev-only value — never reuse this outside a machine only you
      # can reach. Anyone with the real SECRET_KEY can forge a login token
      # for any account.
      SECRET_KEY: local-dev-secret-do-not-use-in-production
      # Must match the origin the browser actually loads the frontend from.
      # Defaults to localhost for running this on your own machine — if
      # you're deploying this compose file to a real host instead (e.g. a
      # bare EC2 box without nginx in front), override both this and
      # NEXT_PUBLIC_API_URL below with that host's address, e.g.:
      #   CORS_ORIGINS=http://1.2.3.4:3000 NEXT_PUBLIC_API_URL=http://1.2.3.4:8000 \
      #     docker compose -f docker-compose.local.yml up --build
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Optional — unset means verification codes only land in this
      # container's logs (`docker compose -f docker-compose.local.yml logs
      # api`), not a real inbox — see apps/api/.env.example for setup.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@cyberlab.local}
      # LAB_PROVISIONER=fake (the default) tracks lab sessions through the
      # full state machine without starting any containers. Switch to
      # "docker" only once you've built the lab image(s), e.g.
      # `docker build -t cyberlab/web001:latest ./labs/WEB001` — the
      # docker.sock mount below is what lets this container start sibling
      # lab containers on your machine; treat that mount as seriously as
      # SECRET_KEY, it's effectively root-equivalent host access.
      LAB_PROVISIONER: ${LAB_PROVISIONER:-fake}
      LAB_DOCKER_NETWORK: ${LAB_DOCKER_NETWORK:-cyberlab_lab_net}
      LAB_PUBLIC_HOST: ${LAB_PUBLIC_HOST:-localhost}
      LAB_IDLE_TIMEOUT_MINUTES: ${LAB_IDLE_TIMEOUT_MINUTES:-10}
      LAB_MAX_DURATION_MINUTES: ${LAB_MAX_DURATION_MINUTES:-120}
      LAB_DAILY_SESSION_LIMIT: ${LAB_DAILY_SESSION_LIMIT:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      lab-net-setup:
        condition: service_completed_successfully

  lab-net-setup:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: sh
    command:
      - -c
      - docker network inspect ${LAB_DOCKER_NETWORK:-cyberlab_lab_net} >/dev/null 2>&1 || docker network create ${LAB_DOCKER_NETWORK:-cyberlab_lab_net}

  web:
    build:
      context: ./apps/web
      # The browser talks to the API on its own published port here, not
      # through a shared-origin proxy — see the Dockerfile's ARG comment.
      # Baked in at build time (NEXT_PUBLIC_* vars aren't read at container
      # runtime), so this must be overridden *before* `up --build`, not
      # after — see the CORS_ORIGINS comment above for the matching value.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata_local:
